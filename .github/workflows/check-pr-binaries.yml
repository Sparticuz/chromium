name: Check PR Binaries

on:
  # Metadata only: never check out or execute PR code with this write token.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Check binary status
    runs-on: ubuntu-latest
    steps:
      - name: Check if revision.txt changed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CHANGED=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[] | select(.filename == "_/ec2/revision.txt" or .previous_filename == "_/ec2/revision.txt") | true')

          if [ -n "$CHANGED" ]; then
            echo "revision_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "revision_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get current labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABELS=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
            --jq '[.[].name | select(startswith("binaries:"))]')
          echo "current=${LABELS}" >> "$GITHUB_OUTPUT"

      - name: Compare the pushed revisions
        id: push
        if: github.event.action == 'synchronize' && steps.labels.outputs.current != '[]'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare public file metadata at immutable commits; never check out fork code.
          revision_blob() {
            code=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -o "$RUNNER_TEMP/revision-meta" -w '%{http_code}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/_/ec2/revision.txt?ref=$1") || return 1
            case "$code" in 404) return 0 ;; 200) ;; *) echo "Revision lookup failed: HTTP $code" >&2; return 1 ;; esac
            jq -er 'select(.type == "file") | .sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/revision-meta"
          }
          old=$(revision_blob "$BEFORE")
          new=$(revision_blob "$AFTER")
          if [ -n "$old" ] && [ "$old" = "$new" ]; then echo 'same=true' >> "$GITHUB_OUTPUT"; fi

      - name: Invalidate tests for the previous head
        if: steps.push.outputs.same == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_LABELS: ${{ steps.labels.outputs.current }}
        run: |
          for label in binaries:verified binaries:testing; do
            if jq -e --arg label "$label" 'index($label) != null' <<< "$CURRENT_LABELS" >/dev/null; then
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$label" -X DELETE
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f 'labels[]=binaries:available'
            fi
          done

      - name: Update labels (revision changed -> binaries:needed)
        if: steps.push.outputs.same != 'true' && steps.check.outputs.revision_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          CURRENT_LABELS: ${{ steps.labels.outputs.current }}
        run: |
          CURRENT=$(jq -r '.[]' <<< "$CURRENT_LABELS")

          # Reopening is not a push; keep existing progress for the same PR.
          if [ "$EVENT_ACTION" = reopened ] && echo "$CURRENT" | grep -qxE 'binaries:(available|verified|building|testing)'; then
            echo "binaries already in progress or complete — skipping label update"
            exit 0
          fi

          # Remove all binaries:* labels except binaries:needed
          for LABEL in binaries:available binaries:building binaries:failed binaries:testing binaries:verified binaries:build binaries:test; do
            if echo "$CURRENT" | grep -qx "$LABEL"; then
              gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels/${LABEL}" \
                -X DELETE
            fi
          done

          # Add binaries:needed if not already present
          if ! echo "$CURRENT" | grep -qx 'binaries:needed'; then
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" \
              -f "labels[]=binaries:needed"
          fi

      - name: Update labels (revision unchanged -> binaries:available)
        if: steps.push.outputs.same != 'true' && steps.check.outputs.revision_changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_LABELS: ${{ steps.labels.outputs.current }}
        run: |
          CURRENT=$(jq -r '.[]' <<< "$CURRENT_LABELS")

          # Remove all binaries:* labels except binaries:available
          for LABEL in binaries:needed binaries:verified binaries:building binaries:failed binaries:testing binaries:build binaries:test; do
            if echo "$CURRENT" | grep -qx "$LABEL"; then
              gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels/${LABEL}" \
                -X DELETE
            fi
          done

          # Add binaries:available if not already present
          # (revision unchanged means master's binaries work — tests should still run)
          if ! echo "$CURRENT" | grep -qx 'binaries:available'; then
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" \
              -f "labels[]=binaries:available"
          fi
