AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    MemorySize: 2048
    Timeout: 30
    Architectures:
      - x86_64
    Layers:
      - !Ref layer
    Handler: handlers/index.handler
    Tracing: Active

Resources:
  layer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: sparticuz-chromium
      ContentUri: code/
      CompatibleRuntimes:
        - nodejs20.x
        - nodejs22.x
        - nodejs24.x
        - nodejs26.x

  node20:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXRayDaemonWriteAccess
  node22:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXRayDaemonWriteAccess
  node24:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXRayDaemonWriteAccess
  node26:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs26.x
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXRayDaemonWriteAccess
